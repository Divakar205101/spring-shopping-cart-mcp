spring.application.name=shopping-cart-mcp

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DIVAHOTEL_DEV;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update

# MCP Server
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=shopping-cart-server
spring.ai.mcp.server.version=1.0.0

# Critical for STDIO communication
spring.main.web-application-type=servlet
spring.main.banner-mode=off
logging.threshold.console=OFF
logging.file.name=D:/Projects/spring-mcp/mcp-server.log