spring.application.name=shopping-cart-mcp

# AWS RDS SQL Server
spring.datasource.url=jdbc:sqlserver://springboot-demo.czoa0coss946.eu-north-1.rds.amazonaws.com:1433;databaseName=DIVAHOTEL_DEV;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update

# MCP Server
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=shopping-cart-server
spring.ai.mcp.server.version=1.0.0

# STDIO configuration
spring.main.web-application-type=servlet
spring.main.banner-mode=off
logging.threshold.console=OFF

# Linux log path
logging.file.name=/home/ec2-user/shopping-cart-mcp.log